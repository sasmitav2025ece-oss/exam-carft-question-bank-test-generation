<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff Dashboard</title><link rel="stylesheet" th:href="@{/css/style.css(v=3)}"></head>
<body>
<header><h1>ExamCraft - Staff Dashboard</h1><a href="/">Logout</a></header>
<main class="container">
    <div class="stats">
        <div class="stat"><b th:text="${questionCount}">0</b><span>Questions</span></div>
        <div class="stat"><b th:text="${topicCount}">0</b><span>Topics</span></div>
        <div class="stat"><b th:text="${paperCount}">0</b><span>Test Papers</span></div>
    </div>
    <div class="grid">
        <a class="menu-card" href="/staff/topics">Manage Topics</a>
        <a class="menu-card" href="/staff/questions">Manage Questions</a>
        <a class="menu-card" href="/staff/generate">Generate Test Paper</a>
    </div>
</main>
</body>
</html>
