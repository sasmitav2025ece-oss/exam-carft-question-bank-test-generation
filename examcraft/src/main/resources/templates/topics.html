<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Topics</title><link rel="stylesheet" th:href="@{/css/style.css(v=3)}"></head>
<body>
<header><h1>Manage Topics</h1><a href="/staff/dashboard">Dashboard</a></header>
<main class="container">
<div class="card">
<h2>Add Topic</h2>
<form method="post" action="/staff/topics">
<input name="name" placeholder="e.g. Java" required>
<input name="description" placeholder="Topic description">
<button type="submit">Add Topic</button>
</form>
</div>
<div class="card">
<h2>Topics</h2>
<table><tr><th>ID</th><th>Name</th><th>Description</th></tr>
<tr th:each="t : ${topics}"><td th:text="${t.id}"></td><td th:text="${t.name}"></td><td th:text="${t.description}"></td></tr>
</table>
</div>
</main>
</body></html>
